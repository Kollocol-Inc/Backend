syntax = "proto3";

package quiz;

option go_package = "quiz-service/proto";

import "google/protobuf/timestamp.proto";

service QuizService {
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);
  rpc GetTemplates(GetTemplatesRequest) returns (GetTemplatesResponse);
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse);
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);

  rpc CreateInstance(CreateInstanceRequest) returns (CreateInstanceResponse);
  rpc GetInstance(GetInstanceRequest) returns (GetInstanceResponse);
  rpc GetInstanceByAccessCode(GetInstanceByAccessCodeRequest) returns (GetInstanceByAccessCodeResponse);
  rpc GetHostingInstances(GetHostingInstancesRequest) returns (GetHostingInstancesResponse);
  rpc GetParticipatingInstances(GetParticipatingInstancesRequest) returns (GetParticipatingInstancesResponse);
}

message QuizTemplate {
  string id = 1;
  string owner_id = 2;
  string title = 3;
  string quiz_type = 4; // "sync" or "async"
  QuizSettings settings = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message QuizSettings {
  bool random_order = 1;
  int32 time_limit_total = 2; // seconds, 0 = no limit
  bool show_correct_answers = 3;
}

message SingleChoice {
  repeated string options = 1;
  int32 correct_option = 2;
}

message MultipleChoice {
  repeated string options = 1;
  repeated int32 correct_options = 2;
}

message OpenAnswer {
  string correct_text = 1;
}

message Question {
  string id = 1;
  string template_id = 2;
  string text = 3;
  int32 order_index = 4;
  int32 max_score = 5;
  int32 time_limit_sec = 6; // 0 = no limit
  oneof answer {
    SingleChoice single_choice = 7;
    MultipleChoice multiple_choice = 8;
    OpenAnswer open_answer = 9;
  }
}

message QuizInstance {
  string id = 1;
  string template_id = 2;
  string title = 3;
  string access_code = 4; // 6-digit code
  string status = 5; // "waiting", "active", "finished"
  string group_id = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp start_time = 9;
  google.protobuf.Timestamp deadline = 10;
  string quiz_type = 11;
  QuizSettings settings = 12;
  uint64 total_time = 13;
  uint64 total_questions = 14;
}

message CreateTemplateRequest {
  string user_id = 1;
  string title = 2;
  string quiz_type = 3;
  QuizSettings settings = 4;
  repeated QuestionInput questions = 5;
}

message QuestionInput {
  string id = 1;
  string text = 2;
  int32 order_index = 3;
  int32 max_score = 4;
  int32 time_limit_sec = 5;
  oneof answer {
    SingleChoice single_choice = 6;
    MultipleChoice multiple_choice = 7;
    OpenAnswer open_answer = 8;
  }
}

message CreateTemplateResponse {
  QuizTemplate template = 1;
  repeated Question questions = 2;
}

message GetTemplateRequest {
  string template_id = 1;
  string user_id = 2;
}

message GetTemplateResponse {
  QuizTemplate template = 1;
  repeated Question questions = 2;
}

message GetTemplatesRequest {
  string user_id = 1;
}

message TemplateWithQuestions {
  QuizTemplate template = 1;
  repeated Question questions = 2;
}

message GetTemplatesResponse {
  repeated TemplateWithQuestions templates = 1;
}

message UpdateTemplateRequest {
  string template_id = 1;
  string user_id = 2;
  string title = 3;
  QuizSettings settings = 4;
  repeated QuestionInput questions = 5;
  string quiz_type = 6;
}

message UpdateTemplateResponse {
  QuizTemplate template = 1;
  repeated Question questions = 2;
}

message DeleteTemplateRequest {
  string template_id = 1;
  string user_id = 2;
}

message DeleteTemplateResponse {
}

message CreateInstanceRequest {
  string user_id = 1;
  string template_id = 2;
  string title = 3;
  string group_id = 4;
  google.protobuf.Timestamp deadline = 5;
}

message CreateInstanceResponse {
  QuizInstance instance = 1;
}

message GetInstanceRequest {
  string instance_id = 1;
  string user_id = 2;
}

message GetInstanceResponse {
  QuizInstance instance = 1;
  repeated Question questions = 2;
}

message GetInstanceByAccessCodeRequest {
  string access_code = 1;
  string user_id = 2;
}

message GetInstanceByAccessCodeResponse {
  QuizInstance instance = 1;
  bool has_access = 2;
}

message GetHostingInstancesRequest {
  string user_id = 1;
  string status = 2; // "active", "pending_review", "reviewed", "" = all
}

message GetHostingInstancesResponse {
  repeated QuizInstance instances = 1;
}

message GetParticipatingInstancesRequest {
  string user_id = 1;
  string session_status = 2; // "not_started", "joined", "in_progress", "finished", "" = all
}

message ParticipatingInstance {
  QuizInstance instance = 1;
  string session_status = 2; // "not_started", "joined", "in_progress", "finished"
}

message GetParticipatingInstancesResponse {
  repeated ParticipatingInstance instances = 1;
}
