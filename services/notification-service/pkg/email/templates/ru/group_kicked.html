<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .highlight { color: #007bff; font-weight: bold; }
        .footer { margin-top: 30px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Kollocol — Исключение из группы</h2>
        <p><span class="highlight">{{.KickerName}}</span> исключил(а) вас из группы <span class="highlight">{{.GroupName}}</span>.</p>
        <p>Вы больше не имеете доступа к материалам этой группы.</p>
        <div class="footer">
            <p>Это автоматическое сообщение от Kollocol.</p>
        </div>
    </div>
</body>
</html>
