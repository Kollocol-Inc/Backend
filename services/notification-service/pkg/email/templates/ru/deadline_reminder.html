<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .highlight { color: #007bff; font-weight: bold; }
        .deadline { font-size: 20px; font-weight: bold; color: #dc3545; margin: 15px 0; }
        .footer { margin-top: 30px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Kollocol — Напоминание о дедлайне</h2>
        <p>Срок прохождения теста <span class="highlight">{{.QuizTitle}}</span> истекает через <span class="highlight">{{.RemainingTime}}</span>.</p>
        <div class="deadline">Дедлайн: {{.Deadline}}</div>
        <p>Войдите в Kollocol, чтобы завершить тест до дедлайна.</p>
        <div class="footer">
            <p>Это автоматическое сообщение от Kollocol.</p>
        </div>
    </div>
</body>
</html>
