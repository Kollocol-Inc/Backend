<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .highlight { color: #007bff; font-weight: bold; }
        .score { font-size: 28px; font-weight: bold; color: #007bff; margin: 20px 0; }
        .footer { margin-top: 30px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Kollocol — Оценка обновлена</h2>
        <p>Ваша оценка за <span class="highlight">{{.QuizTitle}}</span> была изменена.</p>
        <p>Текущий результат:</p>
        <div class="score">{{.Score}} / {{.MaxScore}}</div>
        <div class="footer">
            <p>Это автоматическое сообщение от Kollocol.</p>
        </div>
    </div>
</body>
</html>
