syntax = "proto3";

package user;

option go_package = "user-service/proto";

service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc GetProfileByEmail(GetProfileByEmailRequest) returns (GetProfileByEmailResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc DeleteAvatar(DeleteAvatarRequest) returns (DeleteAvatarResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (GetNotificationSettingsResponse);
  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest) returns (UpdateNotificationSettingsResponse);

  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc GetGroups(GetGroupsRequest) returns (GetGroupsResponse);
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
  rpc CheckGroupMembership(CheckGroupMembershipRequest) returns (CheckGroupMembershipResponse);
  rpc GetUsersByIDs(GetUsersByIDsRequest) returns (GetUsersByIDsResponse);
  rpc GetGroupMemberIDs(GetGroupMemberIDsRequest) returns (GetGroupMemberIDsResponse);
  rpc GetNotificationSettingsBatch(GetNotificationSettingsBatchRequest) returns (GetNotificationSettingsBatchResponse);

  rpc UploadGroupAvatar(UploadGroupAvatarRequest) returns (UploadGroupAvatarResponse);
  rpc AcceptGroupInvite(AcceptGroupInviteRequest) returns (AcceptGroupInviteResponse);
  rpc DeclineGroupInvite(DeclineGroupInviteRequest) returns (DeclineGroupInviteResponse);
  rpc InviteGroupMembers(InviteGroupMembersRequest) returns (InviteGroupMembersResponse);
  rpc KickGroupMembers(KickGroupMembersRequest) returns (KickGroupMembersResponse);
  rpc LeaveGroup(LeaveGroupRequest) returns (LeaveGroupResponse);
}

message User {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string avatar_url = 5;
  bool is_registered = 6;
  int64 created_at = 7; // Unix timestamp
  string language = 8;
}

message NotificationSettings {
  string user_id = 1;
  bool new_quizzes = 2;
  bool quiz_results = 3;
  bool group_invites = 4;
  string deadline_reminder = 5; // "1h", "24h", "never"
  int64 updated_at = 6; // Unix timestamp
  bool group_kicked = 7;
}

message Group {
  string id = 1;
  string name = 2;
  string owner_id = 3;
  int64 created_at = 4; // Unix timestamp
  int32 member_count = 5;
  string description = 6;
  string avatar_url = 7;
  int32 pending_count = 8;
}

message GroupWithMembers {
  Group group = 1;
  repeated User members = 2;
  repeated User invited_users = 3;
}

message RegisterRequest {
  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  bytes avatar_data = 4; // Optional
  string avatar_filename = 5; // Optional
}

message RegisterResponse {
  User user = 1;
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  User user = 1;
}

message GetProfileByEmailRequest {
  string email = 1;
}

message GetProfileByEmailResponse {
  User user = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  string first_name = 2; // Optional
  string last_name = 3; // Optional
  bytes avatar_data = 4; // Optional
  string avatar_filename = 5; // Optional
  optional string language = 6;
}

message UpdateProfileResponse {
  User user = 1;
}

message DeleteAvatarRequest {
  string user_id = 1;
}

message DeleteAvatarResponse {
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
}

message GetNotificationSettingsRequest {
  string user_id = 1;
}

message GetNotificationSettingsResponse {
  NotificationSettings settings = 1;
}

message UpdateNotificationSettingsRequest {
  string user_id = 1;
  optional bool new_quizzes = 2;
  optional bool quiz_results = 3;
  optional bool group_invites = 4;
  optional string deadline_reminder = 5;
  optional bool group_kicked = 6;
}

message UpdateNotificationSettingsResponse {
  NotificationSettings settings = 1;
}

message CreateGroupRequest {
  string owner_id = 1;
  string name = 2;
  repeated string member_emails = 3;
  string description = 4;
  string avatar_url = 5;
}

message CreateGroupResponse {
  Group group = 1;
}

message GetGroupsRequest {
  string user_id = 1;
  string filter = 2; // "my", "created", "invitee"
}

message GetGroupsResponse {
  repeated Group groups = 1;
}

message GetGroupRequest {
  string group_id = 1;
  string user_id = 2;
}

message GetGroupResponse {
  GroupWithMembers group = 1;
}

message UpdateGroupRequest {
  string group_id = 1;
  string user_id = 2;
  optional string name = 3;
  optional string description = 4;
  optional string avatar_url = 5;
}

message UpdateGroupResponse {
  Group group = 1;
}

message DeleteGroupRequest {
  string group_id = 1;
  string user_id = 2;
}

message DeleteGroupResponse {
}

message CheckGroupMembershipRequest {
  string group_id = 1;
  string user_id = 2;
}

message CheckGroupMembershipResponse {
  bool is_member = 1;
  string role = 2; // "owner", "admin", "member", or empty if not a member
}

message GetUsersByIDsRequest {
  repeated string user_ids = 1;
}

message GetUsersByIDsResponse {
  repeated User users = 1;
}

message GetGroupMemberIDsRequest {
  string group_id = 1;
}

message GetGroupMemberIDsResponse {
  repeated string user_ids = 1;
}

message GetNotificationSettingsBatchRequest {
  repeated string user_ids = 1;
}

message GetNotificationSettingsBatchResponse {
  map<string, NotificationSettings> settings = 1;
  map<string, string> languages = 2;
}

message UploadGroupAvatarRequest {
  string user_id = 1;
  bytes avatar_data = 2;
  string avatar_filename = 3;
}

message UploadGroupAvatarResponse {
  string avatar_url = 1;
}

message AcceptGroupInviteRequest {
  string group_id = 1;
  string user_id = 2;
}

message AcceptGroupInviteResponse {
  Group group = 1;
}

message DeclineGroupInviteRequest {
  string group_id = 1;
  string user_id = 2;
}

message DeclineGroupInviteResponse {
}

message InviteGroupMembersRequest {
  string group_id = 1;
  string user_id = 2;
  repeated string emails = 3;
}

message InviteGroupMembersResponse {
}

message KickGroupMembersRequest {
  string group_id = 1;
  string user_id = 2;
  repeated string emails = 3;
}

message KickGroupMembersResponse {
}

message LeaveGroupRequest {
  string group_id = 1;
  string user_id = 2;
}

message LeaveGroupResponse {
}
