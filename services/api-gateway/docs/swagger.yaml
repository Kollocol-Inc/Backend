host: localhost:8080
info:
  contact: {}
  termsOfService: http://swagger.io/terms/
  title: Kollocol API
  version: "1.0"
paths:
  /admin/ai/bans:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListAIBansResponse'
      security:
      - BearerAuth: []
      summary: List all AI bans
      tags:
      - AI Bans
    post:
      consumes:
      - application/json
      parameters:
      - description: Ban data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAIBanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CreateAIBanResponse'
      security:
      - BearerAuth: []
      summary: Ban a user from AI features
      tags:
      - AI Bans
  /admin/ai/bans/{userId}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Remove AI ban for a user
      tags:
      - AI Bans
    get:
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetAIBanResponse'
      security:
      - BearerAuth: []
      summary: Get AI ban for a user
      tags:
      - AI Bans
  /auth/login:
    post:
      consumes:
      - application/json
      description: Send verification code to email
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Start login process
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke access and refresh tokens
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LogoutResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Get a new access token using refresh token
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Verify the code sent to email and receive JWT tokens
      parameters:
      - description: Verify code request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.VerifyCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Verify code and get tokens
      tags:
      - auth
  /groups:
    get:
      description: Get all groups the user is a member of
      parameters:
      - default: my
        description: Filter by membership type
        enum:
        - my
        - created
        in: query
        name: filter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
