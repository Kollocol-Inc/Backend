  dto.QuestionInput:
    properties:
      correct_answer:
        description: 'Format depends on type: single -> integer index (e.g. 0), multiple
          -> array of indices (e.g. [0,2]), open -> string (e.g. "Math")'
        example: "0"
        type: string
      max_score:
        example: 1
        type: integer
      options:
        description: Required for single and multiple types. Not used for open.
        example:
        - "4"
        - "3"
        - "5"
        - "6"
        items:
          type: string
        type: array
      text:
        example: What is 2+2?
        type: string
      time_limit_sec:
        example: 30
        type: integer
      type:
        description: Question type. Determines the format of correct_answer and whether
          options are required.
        enum:
        - single
        - multiple
        - open
        example: single
        type: string
