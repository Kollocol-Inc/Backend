    type: object
  dto.GeneratedQuestionDTO:
    properties:
      correct_answer:
        example: "0"
        type: string
      max_score:
        example: 1
        type: integer
      options:
        example:
        - "4"
        - "3"
        - "5"
        - "6"
        items:
          type: string
        type: array
      text:
        example: What is 2+2?
        type: string
      time_limit_sec:
        example: 30
        type: integer
      type:
